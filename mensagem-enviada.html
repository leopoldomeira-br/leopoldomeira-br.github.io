<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c0e">
<title>Mensagem enviada — LEO</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0c0e;--panel:#151820;--ink:#f3efe7;--muted:#a9a39a;--line:#2b2e36;--gold:#d8b36a;--max:820px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 500px at 12% 22%,rgba(216,179,106,.08),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.7}
main{width:min(100%,var(--max));padding:48px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-size:.75rem}h1{font:500 clamp(2.6rem,7vw,4.8rem)/1 Georgia,"Times New Roman",serif;margin:.25em 0}.lead{color:var(--muted);max-width:620px}.btn{display:inline-flex;margin-top:18px;padding:11px 15px;border:1px solid #8b7446;border-radius:10px;background:#2a2419;color:var(--ink);text-decoration:none;font-size:.9rem}.btn:hover{background:#383022}
</style>
</head>
<body>
<main>
  <div class="eyebrow">LEO / Contato</div>
  <h1>Mensagem enviada.</h1>
  <p class="lead">Obrigado pela mensagem. Ela será encaminhada para contato@leopoldomeira.com.br.</p>
  <a class="btn" href="index.html#contato">Voltar ao site</a>
</main>
</body>
</html>
